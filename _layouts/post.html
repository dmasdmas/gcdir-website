---
layout: default
---
<article>
  <header class="page-hero page-hero--post">
    <div class="wrap narrow">
      <p class="eyebrow"><a href="{{ '/blog/' | relative_url }}">Blog</a></p>
      <h1>{{ page.title }}</h1>
      {% if page.excerpt %}<p class="lede">{{ page.excerpt | strip_html }}</p>{% endif %}
      <p class="post-byline">
        <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%-d %B %Y" }}</time>
        {% if page.author %}<span aria-hidden="true">·</span> {{ page.author }}{% endif %}
      </p>
    </div>
  </header>
  <div class="section">
    <div class="wrap narrow prose">
      {{ content }}
    </div>
  </div>
</article>
{% include cta.html %}
