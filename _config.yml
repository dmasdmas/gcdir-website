title: Global Center for Digital Influence Research
short_title: GCDIR
tagline: Independent research on digital influence
description: "GCDIR is an independent research center that studies persuasion on social media, using conversion and sales records from commercial influencer campaigns."
url: "https://gcdir.org"
baseurl: ""
lang: en
email: contact@gcdir.org
author: Global Center for Digital Influence Research
logo: /assets/images/gcdir_logo.png

markdown: kramdown
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

permalink: /blog/:year/:month/:day/:title/

# Main navigation (header and footer)
nav:
  - title: Research
    url: /research/
  - title: Data
    url: /data/
  - title: People
    url: /people/
  - title: Events
    url: /events/
  - title: About
    url: /about/
  - title: Blog
    url: /blog/

# Site-wide bar above the header that links to the symposium (details in
# _data/symposium.yml). Set to false to hide it.
announcement: true

# Where the /apply/ form sends applications. Leave empty and the form opens the
# applicant's email app with their answers filled in, addressed to `email`.
# Set it to a Formspree endpoint (https://formspree.io/f/xxxxxxxx) and
# applications arrive by email without leaving the page.
apply_form_endpoint: ""

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: pages
    values:
      layout: page
  - scope:
      path: ""
    values:
      image: /assets/images/gcdir_logo.png

twitter:
  card: summary

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
  - .jekyll-cache
