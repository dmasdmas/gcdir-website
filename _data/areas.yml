# Research areas shown on the home and research pages.
- title: Platform dynamics
  text: How ranking algorithms and network structure shape what people see, and what that does to attention and behavior.
- title: Misinformation
  text: How misleading claims spread on social platforms, and whether trusted creators speed them up or slow them down.
- title: Political communication
  text: Whether methods from commercial influencer campaigns carry over to political campaigning and advertising, and with what effect.
- title: Generative AI and synthetic media
  text: How AI-generated creators and content persuade, and the measurement problems they raise.
