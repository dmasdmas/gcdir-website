{% if site.announcement and page.url != '/events/' %}{% assign s = site.data.symposium %}
<div class="announce">
  <a href="{{ '/events/' | relative_url }}">
    <span class="announce-dot" aria-hidden="true"></span>
    <span><strong>{{ s.edition }} {{ s.title }}</strong><span class="announce-long"> &middot; {{ s.when }} &middot; {{ s.venue }}, {{ s.city }}</span></span>
    <span class="announce-cta">Register interest</span>
  </a>
</div>
{% endif %}
