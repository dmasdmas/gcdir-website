<section class="section section--cta">
  <div class="container">
    <div class="cta">
      <div class="cta-art" aria-hidden="true">{% include hero-art.svg %}</div>
      <div class="cta-copy">
        <h2>{{ include.title | default: "Contact" }}</h2>
        <p>{{ include.text | default: "Researchers who would like to use the data, propose a joint project or join as an affiliate can apply online or write to the Center." }}</p>
      </div>
      <div class="actions">
        <a class="btn btn-light" href="{{ '/apply/' | relative_url }}">Apply</a>
        <a class="btn btn-ghost" href="mailto:{{ site.email }}">{{ site.email }}</a>
      </div>
    </div>
  </div>
</section>
