<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.title }}, home">
      {% include mark.svg %}
      <span class="brand-text">
        <span class="brand-name">{{ site.short_title }}</span>
        <span class="brand-full">{{ site.title }}</span>
      </span>
    </a>
    <input type="checkbox" id="nav-toggle" class="nav-toggle">
    <label for="nav-toggle" class="nav-button" aria-label="Open menu"><span></span></label>
    <nav class="site-nav" aria-label="Main">
      {% for item in site.nav %}
        <a href="{{ item.url | relative_url }}"{% if page.url contains item.url %} aria-current="page"{% endif %}>{{ item.title }}</a>
      {% endfor %}
      <a class="btn btn-primary btn-small" href="{{ '/contact/' | relative_url }}"{% if page.url == '/contact/' %} aria-current="page"{% endif %}>Contact</a>
    </nav>
  </div>
</header>
